[package]
name = "winit-embedder"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyrender = { version = "0.10", features = ["serde"] }
anyrender_vello = "0.10.1"
arboard = { version = "3.6.1", default-features = false }
automation = { path = "../../automation" }
blitz-traits = { workspace = true }
cursor-icon = "1"
embedder-core = { path = "../core" }
ipc = { path = "../../ipc" }
ipc-channel = { git = "https://github.com/gterzian/ipc-channel", rev = "169da83" }
ipc_messages = { path = "../../ipc_messages" }
keyboard-types = "0.7"
kurbo = "0.13"
log = "0.4"
peniko = "0.6"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
verification = { path = "../../verification" }
webview = { path = "../../webview", default-features = false }
wgpu = "29"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
