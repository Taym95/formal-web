[package]
name = "embedder"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "embedder"
path = "src/lib.rs"

[[bin]]
name = "formal-web-embedder"
path = "src/main.rs"

[features]
default = ["media"]
media = ["embedder-core/media"]
# Force the winit windowed backend on macOS (the default there is the
# AppKit backend). On other platforms the winit backend is the only option.
winit_embedder = ["embedder-backend/winit_embedder"]

[dependencies]
automation = { path = "../automation" }
clap = { version = "4.5", features = ["derive"] }
embedder-backend = { path = "backend" }
embedder-core = { path = "core" }
env_logger = "0.11"
log = "0.4"
verification = { path = "../verification" }
